<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UX Design Squad ｜ Northstar</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&family=DM+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0f2b45;--sub:#5b6b7b;--line:#e3e8ee;
  --h1:#0077D9;--h1-soft:#eaf3fb;
  --h2:#0e9f6e;--h2-soft:#e9f8f1;
}
body{font-family:'Noto Sans JP',sans-serif;background:#f6f8fb;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:56px 24px 64px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}

.brand{text-align:center;margin-bottom:40px}
.brand .sq{font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--sub)}
.brand .ns{font-family:'DM Sans',sans-serif;font-size:44px;font-weight:900;letter-spacing:-.01em;color:var(--ink);line-height:1.05;margin-top:6px}
.brand .tag{font-size:13.5px;color:var(--sub);margin-top:12px}

.gates{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.gate{position:relative;display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 32px 30px;overflow:hidden;transition:transform .14s,box-shadow .16s,border-color .16s}
.gate:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(15,43,69,.13)}
.gate::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px}
.gate.h1::before{background:var(--h1)} .gate.h2::before{background:var(--h2)}
.gate.h1:hover{border-color:var(--h1)} .gate.h2:hover{border-color:var(--h2)}
.gate .ey{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.06em;padding:5px 12px;border-radius:999px;margin-bottom:18px}
.gate.h1 .ey{background:var(--h1-soft);color:var(--h1)} .gate.h2 .ey{background:var(--h2-soft);color:var(--h2)}
.gate .big{font-family:'DM Sans',sans-serif;font-size:40px;font-weight:900;letter-spacing:-.01em;line-height:1}
.gate .mission{font-size:16px;font-weight:800;margin-top:6px}
.gate .period{font-size:13px;color:var(--sub);margin-top:10px}
.gate .desc{font-size:12.8px;color:var(--sub);line-height:1.65;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.gate .go{position:absolute;right:26px;bottom:26px;font-size:20px;color:var(--sub);transition:transform .14s,color .14s}
.gate:hover .go{transform:translateX(4px)}
.gate.h1:hover .go{color:var(--h1)} .gate.h2:hover .go{color:var(--h2)}
.now{position:absolute;top:22px;right:24px;font-size:11px;font-weight:800;color:#fff;background:var(--h2);padding:3px 10px;border-radius:999px}

.foot{text-align:center;font-size:11.5px;color:#9aa7b4;margin-top:40px}
.foot a{color:inherit}
@media(max-width:720px){.gates{grid-template-columns:1fr}.brand .ns{font-size:36px}.gate .big{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="sq">UX Design Squad</div>
    <div class="ns">Northstar</div>
    <div class="tag">主指標 = CVR ／ 期ごとのミッションから入る</div>
  </div>

  <div class="gates">

    <a class="gate h1" href="/2026h1/">
      <span class="ey">H1 · 2Q</span>
      <div class="big">H1</div>
      <div class="mission">2Q Mission</div>
      <div class="period">2026年 4〜6月</div>
      <div class="desc">CVR 改善プロジェクト。ボトルネック分析・週次レポート・KPI・施策一式。</div>
      <span class="go">→</span>
    </a>

    <a class="gate h2" href="/2026h2/">
      <span class="now">現在</span>
      <span class="ey">H2 · 3Q</span>
      <div class="big">H2</div>
      <div class="mission">3Q Mission</div>
      <div class="period">2026年 7〜9月</div>
      <div class="desc">UX Design Squad の指針＆管理ボード。ミッション・外部状況・担当者別プロジェクト。</div>
      <span class="go">→</span>
    </a>

  </div>

  <div class="foot">UX Design Squad ｜ Northstar ・ <a href="https://analytics.google.com/analytics/web/#/p347074845/reports/reportinghub" target="_blank" rel="noopener">GA4: 347074845</a></div>

</div>
</body>
</html>
